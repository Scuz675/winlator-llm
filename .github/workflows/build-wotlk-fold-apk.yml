name: Build WotLK Fold APK

on:
  workflow_dispatch:
  push:
    branches:
      - wotlk-fold

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 1
          submodules: recursive

      - name: Import known-good FrontMage runtime
        run: |
          curl -fL --retry 3 \
            -o /tmp/frontmage.apk \
            https://github.com/FrontMage/winlator-llm/releases/download/llm-apk-20260216-144633/app-debug.apk

          echo "01d364cafc77bb919a89668ac20618a108763c4e46ef3a81a104a4dc4bf98b2e  /tmp/frontmage.apk" \
            | sha256sum -c -

          mkdir -p /tmp/frontmage-apk
          unzip -q /tmp/frontmage.apk 'assets/*' -d /tmp/frontmage-apk

          cp -a /tmp/frontmage-apk/assets/. app/src/main/assets/

          echo "Checking critical runtime assets..."
          test -s app/src/main/assets/imagefs.txz
          test -s app/src/main/assets/preinstall/proton-10-arm64ec.wcp.xz

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;22.1.7171670" \
            "cmake;3.22.1"

      - name: Set up Java 11 for Winlator build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore persistent debug signing key
        env:
          WOTLK_DEBUG_KEYSTORE_B64: ${{ secrets.WOTLK_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"

          python3 - <<'PY'
          import os
          import base64
          from pathlib import Path

          encoded = os.environ["WOTLK_DEBUG_KEYSTORE_B64"]

          # Remove spaces/newlines introduced by mobile copy/paste.
          encoded = "".join(encoded.split())

          decoded = base64.b64decode(encoded, validate=True)

          path = Path.home() / ".android" / "debug.keystore"
          path.write_bytes(decoded)

          print(f"Restored signing key: {len(decoded)} bytes")
          PY

          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify signing key
        run: |
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WotLK-Fold-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
