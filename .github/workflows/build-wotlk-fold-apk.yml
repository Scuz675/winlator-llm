name: Build WotLK Fold APK

on:
  workflow_dispatch:
  push:
    branches:
      - wotlk-fold

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 1
          submodules: recursive

      - name: Fetch FrontMage runtime assets
        run: |
          git lfs install --local
          git remote add upstream https://github.com/FrontMage/winlator-llm.git
          git lfs fetch upstream
          git lfs checkout

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;22.1.7171670" \
            "cmake;3.22.1"

      - name: Set up Java 11 for Winlator build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WotLK-Fold-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
